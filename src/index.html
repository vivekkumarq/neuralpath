<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>NeuralPath — AI/ML Engineering by Vivek Kumar</title>
    <meta
      name="description"
      content="A structured path from machine learning fundamentals to modern LLM and AI engineering: roadmap, concepts, interactive diagrams, projects and interview preparation."
    />
    <meta name="author" content="Vivek Kumar" />
    <meta name="theme-color" content="#0a0d12" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <script>
      // Apply the stored appearance before first paint, so there is no flash of
      // the wrong theme, typeface or text size. Kept in sync with
      // core/services/appearance.service.ts.
      (function () {
        var read = function (key, fallback) {
          try {
            var raw = localStorage.getItem('neuralpath:v1:' + key);
            return raw ? JSON.parse(raw) : fallback;
          } catch (e) {
            return fallback;
          }
        };

        var themes = ['dark','light','carbon','midnight','nord','dracula','forest','ocean','solarized','sepia','contrast'];
        var light = ['light','solarized','sepia'];
        var sizes = ['s','m','l','xl'];

        var theme = read('theme', 'dark');
        if (themes.indexOf(theme) === -1) theme = 'dark';
        var size = read('size', 'm');
        if (sizes.indexOf(size) === -1) size = 'm';
        var font = read('font', 'inter');

        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-font', typeof font === 'string' ? font : 'inter');
        root.setAttribute('data-size', size);
        root.style.colorScheme = light.indexOf(theme) === -1 ? 'dark' : 'light';
        if (read('focus', false) === true) root.setAttribute('data-focus', 'on');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      NeuralPath is an interactive curriculum and needs JavaScript. The full topic outline is in the
      project README on GitHub.
    </noscript>
  </body>
</html>
