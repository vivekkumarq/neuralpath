name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the build on a broken cross-reference, an invalid quiz or a
      # dead internal slug before anything is deployed.
      - run: npm test

      - name: Refresh the sitemap
        run: npm run sitemap

      # The site is served from the root of its custom domain (public/CNAME),
      # so assets and routes resolve against "/".
      - name: Build for GitHub Pages
        run: npm run build -- --base-href /

      - name: Prepare static output
        run: |
          # GitHub Pages serves unknown paths from 404.html, which is how a
          # single-page app keeps deep links such as /learn/rag working - but
          # with a 404 status. Every page in the sitemap therefore also gets a
          # real copy of the shell, so it is answered with 200.
          cp dist/neuralpath/browser/index.html dist/neuralpath/browser/404.html
          node tools/static-routes.mjs dist/neuralpath/browser
          touch dist/neuralpath/browser/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/neuralpath/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
